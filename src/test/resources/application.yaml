spring:
  application:
    name: backend-test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: false
        highlight_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: false

jwt:
  secret: gollagolla-secret-test-key-must-be-at-least-32-characters-long
  access-token-expiry-ms: 3600000      # 1시간
  refresh-token-expiry-ms: 604800000   # 7일

app:
  share-base-url: http://localhost/s/

oauth:
  google:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/login/oauth2/code/google
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
  kakao:
    client-id: test-kakao-id
    redirect-uri: http://localhost:8080/login/oauth2/code/kakao
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  naver:
    client-id: test-naver-id
    client-secret: test-naver-secret
    redirect-uri: http://localhost:8080/login/oauth2/code/naver
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me

ai:
  google:
    genai:
      api-key: dummy-test-api-key

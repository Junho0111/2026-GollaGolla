spring:
  application:
    name: backend

  profiles:
    active: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gollagolla;MODE=MYSQL
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: false
        highlight_sql: true
        jdbc:
          time_zone: Asia/Seoul

jwt:
  secret: gollagolla-secret-key-must-be-at-least-32-characters-long
  access-token-expiry-ms: 3600000      # 1시간
  refresh-token-expiry-ms: 604800000   # 7일

app:
  share-base-url: https://gollagolla.app/s/
